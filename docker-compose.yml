services:
  app:
    image: node:22-alpine
    container_name: first-nextjs-app
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --webpack"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - WATCHPACK_POLLING=true

volumes:
  node_modules: